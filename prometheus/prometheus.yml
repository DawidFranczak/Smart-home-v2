global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'django'
    static_configs:
      - targets: ['backend:8000']

  - job_name: 'fastapi'
    static_configs:
      - targets: ['sensor_service:8000']

  - job_name: 'postgres'
    static_configs:
      - targets: ['db-backend-exporter:9187', 'db-sensor-service-exporter:9187']

  - job_name: celery
    static_configs:
      - targets: ['celery-exporter:9808']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']