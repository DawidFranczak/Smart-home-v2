services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate run --token ${TOKEN_PROD}
    depends_on:
      - nginx
    restart: unless-stopped
    networks:
      mynet:
        ipv4_address: 172.155.0.100

  mediamtx:
    image: bluenviron/mediamtx:latest
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml
    restart: unless-stopped
    networks:
      mynet:
        ipv4_address: 172.155.0.10

  db-backend:
    image: postgres
    env_file:
      - env/db_backend.env
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    networks:
      mynet:
        ipv4_address: 172.155.0.9      
  
  db-sensor-service:
    image: postgres
    env_file:
      - env/db_sensor_service.env
    volumes:
      - postgres_data_sensor:/var/lib/postgresql
    restart: unless-stopped
    networks:
        mynet:
          ipv4_address: 172.155.0.8
          
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
        mynet:
          ipv4_address: 172.155.0.7

  backend:
    image: nietwid/smart-home-backend:latest
    command: sh -c " python manage.py makemigrations && python manage.py migrate && daphne -b 0.0.0.0 -p 8000 smart_home.asgi:application"
    ports:
      - "8000:8000"
    env_file:
      - env/backend_prod.env
      - env/db_backend.env
    secrets:
      - jwt_private_key
      - jwt_public_key
    environment: 
      - JWT_PRIVATE_KEY_PATH=/run/secrets/jwt_private_key
      - JWT_PUBLIC_KEY_PATH=/run/secrets/jwt_public_key
    depends_on:
      - db-backend
      - redis
      - rabbitmq
    restart: unless-stopped
    networks:
      mynet:
        ipv4_address: 172.155.0.6

  sensor_service:
    image: nietwid/sensor-service:latest
    command: "uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8001:8000"
    secrets:
      - jwt_public_key
    environment:
      - JWT_PUBLIC_KEY_PATH=/run/secrets/jwt_public_key
    env_file:
      - env/sensor_service.env
      - env/db_sensor_service.env
    depends_on:
      - db-sensor-service
      - redis
      - rabbitmq
    restart: unless-stopped
    networks:
      mynet:
        ipv4_address: 172.155.0.5

  rabbitmq:
    image: rabbitmq:3-management
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/init.sh:/docker-entrypoint-init.d/init.sh:ro 
    restart: unless-stopped
    networks:
      mynet:
        ipv4_address: 172.155.0.4

  celery:
    image: nietwid/smart-home-backend
    command: celery -A smart_home worker -Q default -l info -c 4 --uid=10 --hostname=default@%h
    secrets:
      - jwt_private_key
      - jwt_public_key
    environment: 
      - JWT_PRIVATE_KEY_PATH=/run/secrets/jwt_private_key
      - JWT_PUBLIC_KEY_PATH=/run/secrets/jwt_public_key
    env_file:
      - env/backend_prod.env
    depends_on:
      - db-backend
      - redis
      - backend
    restart: unless-stopped
    networks:
      mynet:
        ipv4_address: 172.155.0.11

  celery-ai:
    image: nietwid/smart-home-backend
    command: celery -A smart_home worker -Q ai -l info -c 1 --uid=10 --hostname=ai@%h
    env_file:
      - env/backend_prod.env
    secrets:
      - jwt_private_key
      - jwt_public_key
    environment: 
      - JWT_PRIVATE_KEY_PATH=/run/secrets/jwt_private_key
      - JWT_PUBLIC_KEY_PATH=/run/secrets/jwt_public_key
      - CELERY_QUEUE=ai
      - HF_HOME=/app/.cache/huggingface
    depends_on:
      - db-backend
      - redis
      - backend
    volumes:
      - ${HF_CACHE_DIR}:/app/.cache/huggingface/hub
      - ${AI_MODELS_DIR}:/app/ai_assistance/models
    restart: unless-stopped
    networks:
      mynet:
        ipv4_address: 172.155.0.12

  celery-beat:
    image: nietwid/smart-home-backend
    command: >
      sh -c "./wait-for-it.sh db-backend:5432 -- 
            ./wait-for-it.sh redis:6379 -- 
            celery -A smart_home beat -l info"
    secrets:
      - jwt_private_key
      - jwt_public_key
    environment: 
      - JWT_PRIVATE_KEY_PATH=/run/secrets/jwt_private_key
      - JWT_PUBLIC_KEY_PATH=/run/secrets/jwt_public_key
    env_file:
      - env/backend_prod.env
    depends_on:
      - db-backend
      - redis
      - backend
      - celery
    restart: unless-stopped
    networks:
      mynet:
        ipv4_address: 172.155.0.13

  nginx:
    image: nietwid/smart-home-nginx:latest
    ports:
      - "80:80"
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      mynet:
        ipv4_address: 172.155.0.14
        
networks:
  mynet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.155.0.0/16
     
secrets:
  jwt_private_key:
    file: ./secrets/private.pem
  jwt_public_key:
    file: ./secrets/public.pem

volumes:
  postgres_data: {}
  postgres_data_sensor: {}
  rabbitmq_data: {}
