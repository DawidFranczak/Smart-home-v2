services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate run --token ${TOKEN_PROD}
    depends_on:
      - nginx
    restart: unless-stopped
    networks:
      mynet:
        ipv4_address: 172.155.0.100

  mediamtx:
    image: bluenviron/mediamtx:latest
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml
    restart: unless-stopped
    networks:
      mynet:
        ipv4_address: 172.155.0.10

  db-backend:
    image: postgres
    env_file:
      - env/db_backend.env
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    networks:
      mynet:
        ipv4_address: 172.155.0.9  
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5    
  
  db-sensor-service:
    image: postgres
    env_file:
      - env/db_sensor_service.env
    volumes:
      - postgres_data_sensor:/var/lib/postgresql
    restart: unless-stopped
    networks:
        mynet:
          ipv4_address: 172.155.0.8
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5   

  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbit-server
    environment:
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbitmq_management load_definitions "/etc/rabbitmq/definitions.json"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    restart: unless-stopped
    networks:
      mynet:
        ipv4_address: 172.155.0.4
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
          
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
        mynet:
          ipv4_address: 172.155.0.7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      internal: 10s
      timeout: 5s
      retries: 5

  backend:
    image: nietwid/smart-home-backend:latest
    ports:
      - "8000:8000"
    env_file:
      - env/backend_prod.env
      - env/db_backend.env
    secrets:
      - jwt_private_key
      - jwt_public_key
    environment: 
      - JWT_PRIVATE_KEY_PATH=/run/secrets/jwt_private_key
      - JWT_PUBLIC_KEY_PATH=/run/secrets/jwt_public_key
    restart: unless-stopped
    networks:
      mynet:
        ipv4_address: 172.155.0.6
    depends_on:
      db-backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  sensor_service:
    image: nietwid/sensor-service:latest
    command: "uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8001:8000"
    secrets:
      - jwt_public_key
    environment:
      - JWT_PUBLIC_KEY_PATH=/run/secrets/jwt_public_key
    env_file:
      - env/sensor_service.env
      - env/db_sensor_service.env
    restart: unless-stopped
    networks:
      mynet:
        ipv4_address: 172.155.0.5
    depends_on:
      db-sensor-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    image: nietwid/smart-home-backend
    command: celery -A smart_home worker -Q default -l info -c 4 --uid=10 --hostname=default@%h --pool=solo
    secrets:
      - jwt_private_key
      - jwt_public_key
    environment: 
      - JWT_PRIVATE_KEY_PATH=/run/secrets/jwt_private_key
      - JWT_PUBLIC_KEY_PATH=/run/secrets/jwt_public_key
    env_file:
      - env/backend_prod.env
      - env/db_backend.env
    restart: unless-stopped
    networks:
      mynet:
        ipv4_address: 172.155.0.11
    depends_on:
      db-backend:
        condition: service_healthy
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
        
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      mynet:
        ipv4_address: 172.155.0.101

  db-backend-exporter:
    image: prometheuscommunity/postgres-exporter
    env_file:
      - env/db_backend_exporter.env
    depends_on:
      db-backend:
        condition: service_healthy
    networks:
      mynet:
        ipv4_address: 172.155.0.110

  db-sensor-service-exporter:
    image: prometheuscommunity/postgres-exporter
    env_file:
      - env/db_sensor_service_exporter.env
    depends_on:
      db-sensor-service:
        condition: service_healthy
    networks:
      mynet:
        ipv4_address: 172.155.0.111

  celery-exporter:
    image: danihodovic/celery-exporter
    env_file:
      - env/backend_dev.env

    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      mynet:
        ipv4_address: 172.155.0.112

  node-exporter:
    image: prom/node-exporter:latest
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      mynet:
        ipv4_address: 172.155.0.113

  nginx:
    image: nietwid/smart-home-nginx:latest
    ports:
      - "80:80"
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      mynet:
        ipv4_address: 172.155.0.14
        
networks:
  mynet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.155.0.0/16
     
secrets:
  jwt_private_key:
    file: ./secrets/private.pem
  jwt_public_key:
    file: ./secrets/public.pem

volumes:
  postgres_data: {}
  postgres_data_sensor: {}
  rabbitmq_data: {}
